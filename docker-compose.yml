services:
  processor:
    image: bulk-report:dev
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    mem_limit: 3g
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - dev.env
    volumes:
      - ${INPUT:-./data/fixture/linked}:/data/input:ro
      - ./data/output:/data/output
